<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Lotto Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" aria-label="테마 변경">
        <span class="mode-icon">🌙</span>
    </button>
    <div class="app-container">
        <header>
            <h1>LOTTO 6/45</h1>
            <p class="subtitle">당신의 행운을 확인해보세요</p>
        </header>

        <main>
            <div id="ball-display" class="ball-container">
                <!-- Lotto balls will be injected here -->
                <div class="placeholder-text">행운의 번호를 생성해주세요</div>
            </div>

            <div class="controls">
                <button id="generate-btn" class="primary-btn">번호 생성하기</button>
                <button id="clear-btn" class="secondary-btn">기록 삭제</button>
            </div>
        </main>

        <section class="history-section">
            <h2>최근 생성 기록</h2>
            <div id="history-list" class="history-list">
                <!-- History items will be injected here -->
            </div>
        </section>
    </div>
    <script src="main.js" type="module"></script>
</body>
</html>
